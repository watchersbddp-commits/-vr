<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뽑기 & 무기 성장 시뮬레이터</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --danger: #f87171;
      --ok: #4ade80;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .title-area small {
      color: var(--muted);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, input, select {
      font-family: inherit;
      font-size: 0.92rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 8px 12px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.06s ease, opacity 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      border-color: var(--accent);
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    button.gold-btn {
      background: #b45309;
      border-color: #fbbf24;
      color: #fffbeb;
    }

    button.danger-btn {
      background: #7f1d1d;
      border-color: #f87171;
      color: #fee2e2;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 800;
      margin-top: 2px;
      color: var(--gold);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .result-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .inv-list {
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .inv-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      font-size: 0.88rem;
    }

    .tier-d { color: #cbd5e1; }
    .tier-c { color: #86efac; }
    .tier-b { color: #67e8f9; }
    .tier-a { color: #93c5fd; }
    .tier-s { color: #fde047; }
    .tier-ss { color: #fdba74; }
    .tier-sss { color: #fca5a5; }
    .tier-sssp { color: #f472b6; }
    .tier-z { color: #c084fc; }
    .tier-secret { color: #f43f5e; }
    .tier-celestial { color: #38bdf8; }
    .tier-transcendent { color: #a855f7; }
    .tier-divine { color: #facc15; }
    .tier-void { color: #e879f9; text-shadow: 0 0 8px rgba(232,121,249,0.5); }

    /* Mobile Mode */
    body.mobile-mode {
      padding: 10px;
      font-size: 16px;
    }

    body.mobile-mode .stats-grid,
    body.mobile-mode .main-grid {
      grid-template-columns: 1fr;
    }

    body.mobile-mode button,
    body.mobile-mode input,
    body.mobile-mode select {
      min-height: 44px;
      font-size: 1rem;
      padding: 10px 14px;
    }

    body.mobile-mode .btn-row {
      flex-direction: column;
      width: 100%;
    }

    body.mobile-mode .btn-row button {
      width: 100%;
    }

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .modal-title {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--accent);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title-area">
        <h1>⚔️ 뽑기 & 무기 성장 시뮬레이터</h1>
        <small id="accountLabel">계정: 게스트</small>
      </div>
      <div class="btn-row">
        <button id="btnAccount">👤 계정 전환/로그인</button>
        <button id="btnCheat" class="gold-btn">🔑 치트키</button>
        <button id="btnMobileToggle">📱 모바일 모드: OFF</button>
        <button id="btnReset" class="danger-btn">🗑️ 초기화</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">보유 골드(코인)</div>
        <div class="stat-value" id="statCoins">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">보석</div>
        <div class="stat-value" id="statGems">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">골든티켓</div>
        <div class="stat-value" id="statTickets">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">총 공격력</div>
        <div class="stat-value" id="statAtk">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">행운 배율</div>
        <div class="stat-value" id="statLuck">1.00x</div>
      </div>
    </div>

    <div class="main-grid">
      <div>
        <div class="panel">
          <h2>🎰 일반 & 골든 뽑기</h2>
          <div class="btn-row" style="margin-bottom:8px;">
            <button id="btnPull1" class="primary">일반 1회 (100)</button>
            <button id="btnPull10" class="primary">일반 10회 (1k)</button>
            <button id="btnPull100" class="primary">일반 100회 (10k)</button>
          </div>
          <div class="btn-row">
            <button id="btnGolden1" class="gold-btn">🎫 골든 1회</button>
            <button id="btnGolden10" class="gold-btn">🎫 골든 10회</button>
            <button id="btnGoldenAll" class="gold-btn">🎫 골든 전체</button>
          </div>

          <div id="lastPullCard" class="result-box" style="display:none;">
            <div id="lastPullSummary"></div>
          </div>
        </div>

        <div class="panel">
          <h2>🗡️ 사냥 & 행운 강화</h2>
          <div class="btn-row">
            <button id="btnHunt" class="primary">⚔️ 사냥하기 (+코인)</button>
            <button id="btnUpgradeLuck">🍀 행운 강화 (+0.25x / 500)</button>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>🎒 무기 인벤토리 (<span id="invCount">0</span>)</h2>
          <div id="inventoryList" class="inv-list"></div>
        </div>

        <div class="panel">
          <h2>📖 무기 도감 (<span id="codexCount">0</span>)</h2>
          <div id="codexList" style="font-size:0.86rem; color:var(--muted);"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 공통 모달 -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal-box">
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel">취소</button>
        <button id="modalConfirm" class="primary">확인</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // --- Tiers & Constants ---
    const TIERS = [
      { id: 'd', name: 'D', prob: 46.4083, baseAtk: 10, cls: 'tier-d' },
      { id: 'c', name: 'C', prob: 25.0, baseAtk: 25, cls: 'tier-c' },
      { id: 'b', name: 'B', prob: 14.0, baseAtk: 60, cls: 'tier-b' },
      { id: 'a', name: 'A', prob: 8.0, baseAtk: 150, cls: 'tier-a' },
      { id: 's', name: 'S', prob: 4.0, baseAtk: 400, cls: 'tier-s' },
      { id: 'ss', name: 'SS', prob: 1.5, baseAtk: 1000, cls: 'tier-ss' },
      { id: 'sss', name: 'SSS', prob: 0.7, baseAtk: 2600, cls: 'tier-sss' },
      { id: 'sssp', name: 'SSSP', prob: 0.25, baseAtk: 6500, cls: 'tier-sssp' },
      { id: 'z', name: 'Z', prob: 0.1, baseAtk: 16000, cls: 'tier-z' },
      { id: 'secret', name: 'SECRET', prob: 0.025, baseAtk: 45000, cls: 'tier-secret' },
      { id: 'celestial', name: 'CELESTIAL', prob: 0.01, baseAtk: 120000, cls: 'tier-celestial' },
      { id: 'transcendent', name: 'TRANSCENDENT', prob: 0.004, baseAtk: 350000, cls: 'tier-transcendent' },
      { id: 'divine', name: 'DIVINE', prob: 0.0024, baseAtk: 1000000, cls: 'tier-divine' },
      { id: 'void', name: 'VOID', prob: 0.0002, baseAtk: 5000000, cls: 'tier-void' }
    ];

    const TIER_MAP = Object.fromEntries(TIERS.map(t => [t.id, t]));

    const WEAPON_POOL = {
      d: ['녹슨 단검', '나무 검'],
      c: ['철제 검', '사냥꾼의 창'],
      b: ['강철 장검', '기사단의 도끼'],
      a: ['은빛 레이피어', '폭풍의 활'],
      s: ['용살자의 검', '성스러운 메이스'],
      ss: ['심연의 대검', '서리여왕의 창'],
      sss: ['태양의 검', '천둥의 망치'],
      sssp: ['마왕의 파편검', '별빛의 활'],
      z: ['차원 절단검', '파멸의 낫'],
      secret: ['고대의 서 마그로스트'],
      celestial: ['천공의 성검'],
      transcendent: ['희망과 꿈을 품은 대검 호피스트릿'],
      divine: ['세계수의 힘을담은 세계수의 지팡이'],
      void: ['공허의 종말검']
    };

    const STORAGE_PREFIX = 'gacha_sim_v1_';
    const MOBILE_KEY = 'gacha_sim_mobile_mode';
    let currentAccount = localStorage.getItem('gacha_sim_active_account') || 'guest';

    function getStorageKey(acc = currentAccount) {
      return `${STORAGE_PREFIX}${acc}`;
    }

    function createDefaultState() {
      return {
        coins: 1000,
        gems: 0,
        tickets: 3,
        luckLevel: 0,
        equippedId: null,
        inventory: [],
        codex: []
      };
    }

    let state = createDefaultState();

    function loadState() {
      try {
        const raw = localStorage.getItem(getStorageKey());
        if (!raw) {
          state = createDefaultState();
          return;
        }
        const parsed = JSON.parse(raw);
        state = {
          ...createDefaultState(),
          ...parsed,
          inventory: Array.isArray(parsed.inventory) ? parsed.inventory : [],
          codex: Array.isArray(parsed.codex) ? parsed.codex : []
        };
      } catch (e) {
        state = createDefaultState();
      }
    }

    function saveState() {
      localStorage.setItem('gacha_sim_active_account', currentAccount);
      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    // --- Formatting & Helpers ---
    function fmt(n) {
      if (typeof n !== 'number' || !isFinite(n)) return '0';
      const abs = Math.abs(n);
      const units = [
        { val: 1e18, suffix: 'qi' },
        { val: 1e15, suffix: 'qa' },
        { val: 1e12, suffix: 't' },
        { val: 1e9, suffix: 'b' },
        { val: 1e6, suffix: 'm' },
        { val: 1e3, suffix: 'k' }
      ];
      for (const u of units) {
        if (abs >= u.val) {
          return (n / u.val).toFixed(2).replace(/\.00$/, '') + u.suffix;
        }
      }
      return Math.floor(n).toLocaleString('ko-KR');
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function getTotalLuck() {
      return Number((1 + state.luckLevel * 0.25).toFixed(2));
    }

    const SPECIAL_WEAPONS = [
      '고대의 서 마그로스트',
      '희망과 꿈을 품은 대검 호피스트릿',
      '세계수의 힘을담은 세계수의 지팡이'
    ];

    function rollHiddenSpecialWeapon() {
      const idx = Math.floor(Math.random() * SPECIAL_WEAPONS.length);
      return SPECIAL_WEAPONS[idx];
    }

    function createWeapon(tierId) {
      const tier = TIER_MAP[tierId] || TIER_MAP.d;
      const isSpecial = Math.random() < 0.0005;
      const pool = WEAPON_POOL[tier.id] || ['무명 무기'];
      const name = isSpecial ? rollHiddenSpecialWeapon() : pool[Math.floor(Math.random() * pool.length)];
      return {
        id: 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        name,
        tier: tier.id,
        isSpecial,
        enhance: 0
      };
    }

    function getWeaponAtk(w) {
      if (!w) return 0;
      const tier = TIER_MAP[w.tier] || TIER_MAP.d;
      return Math.floor(tier.baseAtk * Math.pow(1.25, w.enhance || 0));
    }

    function getWeaponNameClass(w) {
      const tier = TIER_MAP[w.tier] || TIER_MAP.d;
      return tier.cls;
    }

    function getTotalAtk() {
      const base = 10;
      const eq = state.inventory.find(x => x.id === state.equippedId);
      return base + (eq ? getWeaponAtk(eq) : 0);
    }

    function registerWeaponCodex(name) {
      if (!state.codex.includes(name)) {
        state.codex.push(name);
      }
    }

    // --- Gacha Logic ---
    const PULL_UNIT_COST = 100;

    function rollStandardOnce() {
      const luck = getTotalLuck();
      const weighted = TIERS.map(t => {
        const mult = (t.id === 'd' || t.id === 'c') ? 1 : luck;
        return { tier: t, weight: t.prob * mult };
      });
      const sum = weighted.reduce((acc, x) => acc + x.weight, 0);
      let r = Math.random() * sum;
      for (const item of weighted) {
        if (r < item.weight) return item.tier;
        r -= item.weight;
      }
      return TIER_MAP.d;
    }

    function rollGoldenOnce() {
      const sPlus = TIERS.filter(t => ['s','ss','sss','sssp','z','secret','celestial','transcendent','divine','void'].includes(t.id));
      const sum = sPlus.reduce((acc, t) => acc + t.prob, 0);
      let r = Math.random() * sum;
      for (const t of sPlus) {
        if (r < t.prob) return t;
        r -= t.prob;
      }
      return TIER_MAP.s;
    }

    function doStandardPull(count) {
      const cost = count * PULL_UNIT_COST;
      if (state.coins < cost) {
        showToast('코인이 부족합니다!');
        return;
      }
      state.coins -= cost;
      const summary = {};
      let bestWeapon = null;
      let bestRank = -1;

      for (let i = 0; i < count; i++) {
        const t = rollStandardOnce();
        const w = createWeapon(t.id);
        state.inventory.push(w);
        registerWeaponCodex(w.name);
        summary[t.name] = (summary[t.name] || 0) + 1;
        const rank = TIERS.findIndex(x => x.id === t.id);
        if (rank > bestRank) {
          bestRank = rank;
          bestWeapon = w;
        }
      }
      showPullResult(`일반 ${fmt(count)}회 뽑기 결과`, summary, bestWeapon);
      saveState();
      updateAllUI();
    }

    function doGoldenPull(mode) {
      const count = mode === 'all' ? state.tickets : mode;
      if (count <= 0 || state.tickets < count) {
        showToast('골든티켓이 부족합니다!');
        return;
      }
      state.tickets -= count;
      const summary = {};
      let bestWeapon = null;
      let bestRank = -1;

      for (let i = 0; i < count; i++) {
        const t = rollGoldenOnce();
        const w = createWeapon(t.id);
        state.inventory.push(w);
        registerWeaponCodex(w.name);
        summary[t.name] = (summary[t.name] || 0) + 1;
        const rank = TIERS.findIndex(x => x.id === t.id);
        if (rank > bestRank) {
          bestRank = rank;
          bestWeapon = w;
        }
      }
      showPullResult(`🎫 골든 ${fmt(count)}회 뽑기 결과 (S등급 이상 확정)`, summary, bestWeapon);
      saveState();
      updateAllUI();
    }

    function showPullResult(title, summary, bestWeapon) {
      const card = document.getElementById('lastPullCard');
      const box = document.getElementById('lastPullSummary');
      if (!card || !box) return;
      card.style.display = 'block';
      const badges = Object.entries(summary)
        .map(([tierName, cnt]) => {
          const t = TIERS.find(x => x.name === tierName);
          return `<span class="${t ? t.cls : ''}" style="font-weight:800; margin-right:8px;">[${tierName}] ${fmt(cnt)}개</span>`;
        })
        .join(' ');
      const bestHtml = bestWeapon
        ? `<div style="margin-top:6px;">최고 획득: <strong class="${getWeaponNameClass(bestWeapon)}">[${TIER_MAP[bestWeapon.tier].name}] ${bestWeapon.name}</strong> (⚔️ ${fmt(getWeaponAtk(bestWeapon))})</div>`
        : '';
      box.innerHTML = `<div style="font-weight:800; color:#fbbf24; margin-bottom:4px;">${title}</div><div>${badges}</div>${bestHtml}`;
    }

    // --- Cheat Logic ---
    function openCheatModal() {
      openModal(
        '🔑 치트키 입력',
        `<p style="font-size:0.82rem; color:var(--muted); margin-bottom:8px;">치트코드를 입력하세요.</p>
         <input type="text" id="cheatInput" placeholder="코드 입력" style="width:100%;" />`,
        () => {
          const el = document.getElementById('cheatInput');
          const code = (el ? el.value : '').trim();

          if (code === '384Du8667') {
            state.coins = Math.max(1000, state.coins * 10);
            showToast('🎉 치트키 적용: 보유 코인 10배!');
          } else if (code === '150800') {
            state.coins = Math.max(10000, state.coins * 100);
            showToast('🎉 치트키 적용: 보유 코인 100배!');
          } else if (code === '642097') {
            state.gems += 100000;
            showToast('💎 치트키 적용: 보석 +100,000개!');
          } else if (code === '000') {
            state.tickets += 10;
            showToast('🎫 치트키 적용: 골든티켓 +10개!');
          } else if (code.toLowerCase() === 'freegold9898') {
            state.coins += 300e15;
            showToast('🪙 치트키 적용: 골드 +300Qa!');
          } else {
            showToast('❌ 유효하지 않은 치트키입니다.');
            return;
          }

          saveState();
          updateAllUI();
        }
      );
    }

    // --- Account & Mobile Mode ---
    function openAccountModal() {
      openModal(
        '👤 계정 전환 / 로그인',
        `<p style="font-size:0.85rem; color:var(--muted); margin-bottom:8px;">현재 계정: <strong>${currentAccount}</strong></p>
         <input type="text" id="accountNameInput" placeholder="계정 아이디 입력 (예: player1)" value="${currentAccount}" style="width:100%;" />`,
        () => {
          const input = document.getElementById('accountNameInput');
          const name = (input ? input.value : '').trim();
          if (!name) {
            showToast('계정 이름을 입력하세요.');
            return;
          }
          saveState();
          currentAccount = name;
          loadState();
          saveState();
          updateAllUI();
          showToast(`계정 전환 완료: ${currentAccount}`);
        }
      );
    }

    function applyMobileMode(isMobile) {
      document.body.classList.toggle('mobile-mode', Boolean(isMobile));
      const btn = document.getElementById('btnMobileToggle');
      if (btn) {
        btn.textContent = isMobile ? '📱 모바일 모드: ON' : '📱 모바일 모드: OFF';
      }
      localStorage.setItem(MOBILE_KEY, isMobile ? '1' : '0');
    }

    function toggleMobileMode() {
      const next = !document.body.classList.contains('mobile-mode');
      applyMobileMode(next);
      showToast(next ? '모바일 모드가 켜졌습니다.' : '모바일 모드가 꺼졌습니다.');
    }

    // --- Modal & UI ---
    let pendingConfirmCallback = null;

    function openModal(title, bodyHtml, onConfirm) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      pendingConfirmCallback = typeof onConfirm === 'function' ? onConfirm : null;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
      pendingConfirmCallback = null;
    }

    function equipWeapon(id) {
      state.equippedId = id;
      saveState();
      updateAllUI();
      showToast('무기를 장착했습니다!');
    }

    function enhanceWeapon(id) {
      const w = state.inventory.find(x => x.id === id);
      if (!w) return;
      const cost = 200 * Math.pow(2, w.enhance || 0);
      if (state.coins < cost) {
        showToast(`강화 비용(${fmt(cost)})이 부족합니다!`);
        return;
      }
      state.coins -= cost;
      w.enhance = (w.enhance || 0) + 1;
      saveState();
      updateAllUI();
      showToast(`🔨 ${w.name} +${w.enhance} 강화 성공!`);
    }

    function updateAllUI() {
      document.getElementById('accountLabel').textContent = `계정: ${currentAccount}`;
      document.getElementById('statCoins').textContent = fmt(state.coins);
      document.getElementById('statGems').textContent = fmt(state.gems);
      document.getElementById('statTickets').textContent = fmt(state.tickets);
      document.getElementById('statAtk').textContent = fmt(getTotalAtk());
      document.getElementById('statLuck').textContent = `${getTotalLuck().toFixed(2)}x`;
      document.getElementById('invCount').textContent = state.inventory.length;
      document.getElementById('codexCount').textContent = state.codex.length;

      const invEl = document.getElementById('inventoryList');
      if (!state.inventory.length) {
        invEl.innerHTML = '<div style="color:var(--muted); font-size:0.86rem;">보유한 무기가 없습니다. 뽑기를 진행해 보세요!</div>';
      } else {
        invEl.innerHTML = state.inventory.slice().reverse().map(w => {
          const isEq = state.equippedId === w.id;
          const enhCost = 200 * Math.pow(2, w.enhance || 0);
          return `
            <div class="inv-item">
              <div>
                <strong class="${getWeaponNameClass(w)}">[${TIER_MAP[w.tier].name}] ${w.name}</strong>
                ${w.enhance ? `<span style="color:var(--gold);">+${w.enhance}</span>` : ''}
                <div style="font-size:0.78rem; color:var(--muted);">⚔️ ${fmt(getWeaponAtk(w))} ${isEq ? '· [장착중]' : ''}</div>
              </div>
              <div style="display:flex; gap:6px;">
                <button onclick="equipWeapon('${w.id}')">${isEq ? '장착됨' : '장착'}</button>
                <button onclick="enhanceWeapon('${w.id}')">강화 (${fmt(enhCost)})</button>
              </div>
            </div>
          `;
        }).join('');
      }

      const codexEl = document.getElementById('codexList');
      codexEl.textContent = state.codex.length ? state.codex.join(', ') : '아직 등록된 무기가 없습니다.';
    }

    // --- Event Listeners ---
    document.getElementById('btnPull1').addEventListener('click', () => doStandardPull(1));
    document.getElementById('btnPull10').addEventListener('click', () => doStandardPull(10));
    document.getElementById('btnPull100').addEventListener('click', () => doStandardPull(100));

    document.getElementById('btnGolden1').addEventListener('click', () => doGoldenPull(1));
    document.getElementById('btnGolden10').addEventListener('click', () => doGoldenPull(10));
    document.getElementById('btnGoldenAll').addEventListener('click', () => doGoldenPull('all'));

    document.getElementById('btnHunt').addEventListener('click', () => {
      const gain = Math.max(50, Math.floor(getTotalAtk() * 1.5));
      state.coins += gain;
      saveState();
      updateAllUI();
      showToast(`⚔️ 사냥 성공! +${fmt(gain)} 골드 획득`);
    });

    document.getElementById('btnUpgradeLuck').addEventListener('click', () => {
      const cost = 500 * (state.luckLevel + 1);
      if (state.coins < cost) {
        showToast(`행운 강화 비용(${fmt(cost)})이 부족합니다!`);
        return;
      }
      state.coins -= cost;
      state.luckLevel += 1;
      saveState();
      updateAllUI();
      showToast(`🍀 행운 강화 완료! (${getTotalLuck().toFixed(2)}x)`);
    });

    document.getElementById('btnCheat').addEventListener('click', openCheatModal);
    document.getElementById('btnAccount').addEventListener('click', openAccountModal);
    document.getElementById('btnMobileToggle').addEventListener('click', toggleMobileMode);

    document.getElementById('btnReset').addEventListener('click', () => {
      openModal(
        '🗑️ 데이터 초기화',
        '<p style="font-size:0.88rem; color:var(--danger);">현재 계정의 저장 데이터를 초기화할까요?</p>',
        () => {
          state = createDefaultState();
          saveState();
          updateAllUI();
          showToast('초기화가 완료되었습니다.');
        }
      );
    });

    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalConfirm').addEventListener('click', () => {
      const fn = pendingConfirmCallback;
      closeModal();
      if (fn) fn();
    });

    // --- Boot ---
    applyMobileMode(localStorage.getItem(MOBILE_KEY) === '1');
    loadState();
    saveState();
    updateAllUI();
  </script>
</body>
</html>
